# Small catalog of common SDKs and the Data safety data types each one implies.
# Rules:
# - `data` keys are "<group>.<key>" and match schema/app-content.schema.json data_safety.data_types exactly.
# - Every field comes from the vendor's own disclosure at `source`. A field the source does not state is
#   omitted (not guessed): omitted `shared` / `*_purposes` / `required` / `ephemeral` => needs_review.
# - `collection_purposes` / `sharing_purposes` map to the schema fields of the same name on a data type value.
# - `depends_on_usage` lists data the SDK can collect depending on how the app configures or calls it.
#   Never confirm those from the catalog; ask the owner.
# - `uses_advertising_id: true` means the source says the SDK collects the Android advertising ID.
# - `needs_review_only: true` means no data type could be sourced: the SDK is known, every answer stays needs_review.
# - A package that is not listed here is unknown => needs_review.
sdks:
  - id: firebase_analytics
    name: Firebase Analytics (Google Analytics for Firebase)
    packages:
      pub: [firebase_analytics]
      maven: [com.google.firebase:firebase-analytics, com.google.firebase:firebase-analytics-ktx]
      npm: ["@react-native-firebase/analytics"]
    source: https://support.google.com/analytics/answer/11582702
    also_see: https://firebase.google.com/docs/android/play-data-disclosure
    uses_advertising_id: true   # source: collects the Android advertising ID by default; can be disabled by configuring Analytics data collection
    data:
      device_or_other_ids.device_or_other_ids: { note: app-instance ID and Android advertising ID }
      location.approximate_location: { note: coarse location derived from masked IP address }
      financial_info.purchase_history: { note: in-app purchase and subscription events (product ID, name, price) }
      app_activity.app_interactions: { note: screen views, sessions and app lifecycle events }
    depends_on_usage: [personal_info.user_ids, device_or_other_ids.device_or_other_ids]
    note: User-ID is collected only if the app sets one; account identifiers only if Google signals is enabled

  - id: firebase_crashlytics
    name: Firebase Crashlytics
    packages:
      pub: [firebase_crashlytics]
      maven: [com.google.firebase:firebase-crashlytics, com.google.firebase:firebase-crashlytics-ktx, com.google.firebase:firebase-crashlytics-ndk]
      npm: ["@react-native-firebase/crashlytics"]
    source: https://firebase.google.com/docs/android/play-data-disclosure
    data:
      app_info_and_performance.crash_logs: { note: stack traces and app state at crash }
      app_info_and_performance.diagnostics: { note: device metadata at crash }
      device_or_other_ids.device_or_other_ids: { note: Crashlytics installation UUID }
    depends_on_usage: [personal_info.user_ids]
    note: collects custom keys, logs and free-text user IDs the app attaches to crash reports (grep setCustomKey, log(, setUserIdentifier); depends on the Firebase installations SDK (transitive)

  - id: admob
    name: Google Mobile Ads SDK (AdMob)
    packages:
      pub: [google_mobile_ads]
      maven: [com.google.android.gms:play-services-ads, com.google.android.gms:play-services-ads-lite]
      npm: [react-native-google-mobile-ads]
    source: https://developers.google.com/admob/android/privacy/play-data-disclosure
    ads: true
    uses_advertising_id: true   # source: collects the Android advertising ID unless the manifest removes AD_ID
    data:
      location.approximate_location: { shared: true, note: IP address may be used to estimate general location }
      app_activity.app_interactions: { shared: true, note: app launch, taps, video views }
      app_info_and_performance.diagnostics: { shared: true, note: launch time, hang rate, energy usage }
      device_or_other_ids.device_or_other_ids: { shared: true, note: ad ID, app set ID, account identifiers }
    collection_purposes: [advertising_or_marketing, analytics, fraud_prevention_security_compliance]
    sharing_purposes: [advertising_or_marketing, analytics, fraud_prevention_security_compliance]

  - id: revenuecat
    name: RevenueCat
    packages:
      pub: [purchases_flutter, purchases_ui_flutter]
      maven: [com.revenuecat.purchases:purchases]
      npm: [react-native-purchases]
    source: https://www.revenuecat.com/docs/platform-resources/google-platform-resources/google-plays-data-safety
    data:
      financial_info.purchase_history: { required: true, ephemeral: false }
    collection_purposes: [app_functionality, analytics]
    depends_on_usage: [personal_info.name, personal_info.email_address, personal_info.phone_number, device_or_other_ids.device_or_other_ids]
    note: personal info only if customer attributes carry identifiable contact data; device IDs only with integrations using gpsAdId / androidId; source says "shared" may also apply with integrations to third parties that are not service providers

  - id: sentry
    name: Sentry
    packages:
      pub: [sentry_flutter, sentry]
      maven: [io.sentry:sentry-android, io.sentry:sentry]
      npm: ["@sentry/react-native"]
    source: https://docs.sentry.io/platforms/dart/guides/flutter/data-management/data-collected/
    sources:
      maven: https://docs.sentry.io/platforms/android/data-management/data-collected/
    needs_review_only: true   # the cited pages list data categories but do not map them to Play data types
    depends_on_usage: [app_info_and_performance.crash_logs, app_info_and_performance.diagnostics, location.approximate_location, personal_info.user_ids, personal_info.email_address]
    note: IP address and logged-in user data are not sent by default (sendDefaultPii); full request URLs and query strings of instrumented HTTP requests may contain PII; the Android page lists device and OS context

  - id: aptabase
    name: Aptabase
    packages:
      pub: [aptabase_flutter]
      npm: ["@aptabase/react-native"]
    source: https://aptabase.com/docs/
    also_see: https://aptabase.com/legal/privacy
    needs_review_only: true   # docs: nothing is tracked automatically; events are enriched with OS name/version, app version, locale
    depends_on_usage: [app_activity.app_interactions, app_activity.other_actions]
    note: collects only what the app tracks via trackEvent plus OS/app version/locale; privacy page says it collects no device ID and derives a daily rotating pseudonymous ID server-side from IP and user agent
